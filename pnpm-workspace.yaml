packages:
  - .
  - app
  - cdk/cloudfront
  - cdk/cloudfront/function
  - cdk/kvs

allowBuilds:
  esbuild: true
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes
minimumReleaseAgeExclude:
  - pnpm@12.18.0

overrides:
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  semver: '>=7'

trustPolicy: no-downgrade
